name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: Verify
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must follow semantic versioning, for example v1.2.3"
            exit 1
          fi

      - name: Build release binaries
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/multi-isp-proxy_windows_amd64.exe ./cmd/multi-isp-proxy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/multi-isp-proxy_linux_amd64 ./cmd/multi-isp-proxy
          ./dist/multi-isp-proxy_linux_amd64 -version | grep -Fx "multi-isp-proxy ${VERSION}"

      - name: Create checksums
        working-directory: dist
        shell: bash
        run: sha256sum multi-isp-proxy_windows_amd64.exe multi-isp-proxy_linux_amd64 > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: Multi ISP Proxy ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/multi-isp-proxy_windows_amd64.exe
            dist/multi-isp-proxy_linux_amd64
            dist/checksums.txt
